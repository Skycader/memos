<!-- the frame of a question is drawn with CSS borders, row by row, so the corners meet the lines -->
<ng-template #head let-host="host" let-notes="notes">
  <div class="seg seg-top"><pre class="line">{{ host }}</pre></div>
  <div class="seg seg-mid" *ngFor="let note of notes; let first = first">
    <span class="badge" [class.hidden]="!first" aria-hidden="true">
      <svg viewBox="0 0 16 16" width="12" height="12" focusable="false">
        <rect x="7" y="2.5" width="2" height="7" rx="1" fill="currentColor" />
        <circle cx="8" cy="12.5" r="1.25" fill="currentColor" />
      </svg>
    </span>
    <span class="note-text">{{ note }}</span>
  </div>
</ng-template>

<!-- a card of the repetition mode: the frame, three rows of chips and text -->
<ng-template #cardview let-host="host" let-card="card" let-progress="progress">
  <div class="seg seg-top"><pre class="line">{{ host }}</pre></div>
  <div class="seg seg-mid">
    <span class="chip chip-field" *ngFor="let side of card.shown">{{ side.name }}</span>
    <span class="chip">{{ card.dir }}</span>
    <span class="chip chip-rank" *ngIf="card.rank">{{ card.rank }}</span>
  </div>
  <div class="seg seg-mid card-body" *ngFor="let side of card.shown">
    <pre class="line">{{ side.value }}</pre>
  </div>
  <div class="seg seg-mid">
    <span class="chip" [class.chip-late]="card.late">{{ card.need }}</span>
    <span class="chip chip-age" [style.--fill]="progress">
      <span class="fill" aria-hidden="true"></span>
      <span class="fill-text">{{ card.age }}</span>
    </span>
    <span class="chip chip-menu">
      <svg viewBox="0 0 16 16" width="11" height="11" focusable="false" aria-hidden="true">
        <circle cx="8" cy="8" r="2.2" fill="none" stroke="currentColor" stroke-width="1.5" />
        <path
          d="M8 1.5v2M8 12.5v2M1.5 8h2M12.5 8h2M3.4 3.4l1.4 1.4M11.2 11.2l1.4 1.4M3.4 12.6l1.4-1.4M11.2 4.8l1.4-1.4"
          stroke="currentColor"
          stroke-width="1.5"
          stroke-linecap="round"
        />
      </svg>
      /help
    </span>
  </div>
</ng-template>

<ng-template #confirm let-word="word">
  <span class="chip chip-confirm">CONFIRM</span>
  <span class="type">Type</span>
  <span class="chip chip-word">{{ word }}</span>
  <span class="colon">:</span>
</ng-template>

<div class="terminal" #screen (click)="onScreenClick()">
  <ng-container *ngFor="let line of lines">
    <!-- an answered question stays as it was asked -->
    <div *ngIf="line.kind === 'ask' && line.question as q" class="ask">
      <ng-container
        *ngTemplateOutlet="head; context: { host: line.host, notes: q.notes }"
      ></ng-container>
      <div class="seg seg-bottom">
        <ng-container *ngTemplateOutlet="confirm; context: { word: q.word }"></ng-container>
        <pre class="line answer"> {{ line.text }}</pre>
      </div>
    </div>
    <!-- an answered card stays as it was shown -->
    <div *ngIf="line.kind === 'card' && line.card as c" class="ask">
      <ng-container *ngTemplateOutlet="cardview; context: { host: line.host, card: c, progress: line.progress }"></ng-container>
      <div class="seg seg-bottom">
        <pre class="line">$ {{ line.text }}</pre>
      </div>
    </div>
    <!-- a row of chips: a result with its time, or the totals -->
    <div *ngIf="line.kind === 'chips'" class="chips-row">
      <span
        *ngFor="let chip of line.chips"
        class="chip"
        [class.chip-ok]="chip.kind === 'ok'"
        [class.chip-err]="chip.kind === 'err'"
        [class.chip-warn]="chip.kind === 'warn'"
        [class.chip-dim]="chip.kind === 'dim'"
        [class.chip-time]="chip.kind === 'time'"
      >
        <svg
          *ngIf="chip.icon ?? (chip.kind === 'time' ? 'clock' : '') as icon"
          viewBox="0 0 16 16"
          width="11"
          height="11"
          fill="none"
          stroke="currentColor"
          stroke-width="1.6"
          stroke-linecap="round"
          stroke-linejoin="round"
          focusable="false"
          aria-hidden="true"
          [ngSwitch]="icon"
        >
          <ng-container *ngSwitchCase="'clock'">
            <circle cx="8" cy="8" r="6.25" />
            <path d="M8 4.5V8l2.5 1.5" />
          </ng-container>
          <path *ngSwitchCase="'check'" d="M3 8.5l3.2 3.2L13 4.8" />
          <path *ngSwitchCase="'cross'" d="M4 4l8 8M12 4l-8 8" />
          <path *ngSwitchCase="'move'" d="M3 8h10M9 4l4 4-4 4" />
          <path *ngSwitchCase="'left'" d="M3 4h10M3 8h10M3 12h6" />
        </svg>
        {{ chip.text }}
      </span>
    </div>
    <pre
      *ngIf="line.kind !== 'ask' && line.kind !== 'card' && line.kind !== 'chips'"
      class="line"
      [class.err]="line.kind === 'err'"
      >{{ line.text }}</pre
    >
  </ng-container>

  <div class="prompt">
    <ng-container *ngIf="card as c">
      <ng-container *ngTemplateOutlet="cardview; context: { host: promptHost, card: c, progress: progress }"></ng-container>
      <div class="seg seg-bottom">
        <pre class="line">$ </pre>
        <ng-container *ngTemplateOutlet="field"></ng-container>
      </div>
    </ng-container>
    <ng-container *ngIf="!card && question as q">
      <ng-container
        *ngTemplateOutlet="head; context: { host: promptHost, notes: q.notes }"
      ></ng-container>
      <div class="seg seg-bottom">
        <ng-container *ngTemplateOutlet="confirm; context: { word: q.word }"></ng-container>
        <pre class="line"> </pre>
        <ng-container *ngTemplateOutlet="field"></ng-container>
      </div>
    </ng-container>
    <ng-container *ngIf="!card && !question">
      <pre class="line">{{ promptTop }}</pre>
      <!-- a div, not a label: a label hands the focus to the input on any click and drops a selection -->
      <div class="input-row">
        <pre class="line">╰─$ </pre>
        <ng-container *ngTemplateOutlet="field"></ng-container>
      </div>
    </ng-container>
  </div>
</div>

<ng-template #field>
  <span class="field">
    <!-- the hint of a question: how to abort, or the rest of the word being typed -->
    <span *ngIf="hint as h" class="ghost" aria-hidden="true"
      ><span class="typed">{{ input }}</span
      ><span class="ghost-rest">{{ h.rest }}</span></span
    >
  <input
    #inputRef
    class="input"
    [class.danger]="hint?.kind === 'word'"
    type="text"
    aria-label="terminal input"
    spellcheck="false"
    autocomplete="off"
    autocapitalize="off"
    [(ngModel)]="input"
    (keydown.enter)="submit()"
    (keydown)="onKeydown($event)"
  />
  </span>
</ng-template>
