<div class="terminal" #screen (click)="onScreenClick()">
  <pre *ngFor="let line of lines" class="line" [class.err]="line.kind === 'err'">{{ line.text }}</pre>

  <div class="prompt">
    <pre class="line">{{ promptTop }}</pre>
    <!-- a div, not a label: a label hands the focus to the input on any click and drops a selection -->
    <div class="input-row">
      <pre class="line">╰─$ </pre>
      <input
        #inputRef
        class="input"
        type="text"
        aria-label="terminal input"
        spellcheck="false"
        autocomplete="off"
        autocapitalize="off"
        [(ngModel)]="input"
        (keydown.enter)="submit()"
        (keydown)="onKeydown($event)"
      />
    </div>
  </div>
</div>
